# Generated from packages/ by scripts/generate_esphome_profiles.py.
# Composition: examples/reference/diagnostic.yaml.
# Edit the package or rendering input and regenerate; this is a standalone download.
# Supply wifi_ssid, wifi_password, fallback_password, api_encryption_key, and
# web_server_password in the ESPHome installation's secrets.yaml.

esphome:
  name: photopainter
  friendly_name: PhotoPainter
  min_version: 2026.9.0
  project:
    name: edennelson.waveshare-esp32s3-photopainter
    version: 1.0.0-rc.13
  on_boot:
    - priority: 790.0
      then:
        - lambda: |-
            const char *const TAG = "photopainter_power";
            const uint8_t PMIC_ADDR = 0x34;
            const uint8_t RTC_ADDR = 0x51;

            id(photopainter_shared_i2c_available) = false;
            id(photopainter_power_ready) = false;
            id(photopainter_power_init_complete) = false;
            id(photopainter_axp_state_valid) = false;
            id(photopainter_rtc_state_valid) = false;

            auto read_reg = [&](uint8_t address, uint8_t reg, uint8_t &value) -> bool {
              return id(photopainter_i2c).write_readv(address, &reg, 1, &value, 1) ==
                     esphome::i2c::ERROR_OK;
            };
            auto write_reg = [&](uint8_t reg, uint8_t value) -> bool {
              uint8_t data[2] = {reg, value};
              return id(photopainter_i2c).write(PMIC_ADDR, data, sizeof(data)) ==
                     esphome::i2c::ERROR_OK;
            };

            uint8_t chip_id = 0;
            uint8_t attempts = 0;
            for (attempts = 1; attempts <= 10; attempts++) {
              if (read_reg(PMIC_ADDR, 0x03, chip_id)) break;
              delay(20);
            }
            if (attempts > 10) {
              ESP_LOGE(TAG,
                       "event=boot result=failed stage=pmic_probe attempts=10 "
                       "sda=%d scl=%d",
                       gpio_get_level(GPIO_NUM_47), gpio_get_level(GPIO_NUM_48));
              id(photopainter_power_init_complete) = true;
              return;
            }
            id(photopainter_shared_i2c_available) = true;

            uint8_t power_on_source = 0;
            uint8_t power_off_source = 0;
            const bool power_reason_ok =
                read_reg(PMIC_ADDR, 0x20, power_on_source) &&
                read_reg(PMIC_ADDR, 0x21, power_off_source);
            ESP_LOGI(TAG,
                     "event=power_reason result=%s power_on=0x%02X "
                     "power_off=0x%02X pwron_key=%d vbus=%d battery_insert=%d "
                     "software_off=%d vsys_uvp=%d",
                     power_reason_ok ? "ok" : "failed", power_on_source,
                     power_off_source, (power_on_source & 0x01) ? 1 : 0,
                     (power_on_source & 0x04) ? 1 : 0,
                     (power_on_source & 0x10) ? 1 : 0,
                     (power_off_source & 0x02) ? 1 : 0,
                     (power_off_source & 0x08) ? 1 : 0);

            uint8_t dcdc1_before = 0;
            uint8_t aldo3_before = 0;
            uint8_t aldo4_before = 0;
            uint8_t ldo_enable_before = 0;
            const bool baseline_ok =
                read_reg(PMIC_ADDR, 0x82, dcdc1_before) &&
                read_reg(PMIC_ADDR, 0x94, aldo3_before) &&
                read_reg(PMIC_ADDR, 0x95, aldo4_before) &&
                read_reg(PMIC_ADDR, 0x90, ldo_enable_before);
            if (!baseline_ok) {
              ESP_LOGE(TAG,
                       "event=boot result=failed stage=rail_baseline chip_id=0x%02X",
                       chip_id);
              id(photopainter_power_init_complete) = true;
              return;
            }

            const bool was_configured =
                dcdc1_before == 0x12 &&
                (aldo3_before & 0x1F) == 0x1C &&
                (aldo4_before & 0x1F) == 0x1C &&
                (ldo_enable_before & 0x0C) == 0x0C;

            bool writes_ok = true;
            if (!was_configured) {
              // DCDC1, ALDO3 (audio), and ALDO4 (display) are the verified 3.3 V
              // startup configuration. Preserve all unrelated enable bits. In
              // particular, this package never modifies ALDO2.
              writes_ok &= write_reg(0x82, 0x12);
              writes_ok &= write_reg(0x94, (aldo3_before & 0xE0) | 0x1C);
              writes_ok &= write_reg(0x95, (aldo4_before & 0xE0) | 0x1C);
              writes_ok &= write_reg(0x90, ldo_enable_before | 0x0C);
              delay(100);
            }

            uint8_t dcdc1_after = 0;
            uint8_t aldo3_after = 0;
            uint8_t aldo4_after = 0;
            uint8_t ldo_enable_after = 0;
            const bool verify_reads_ok =
                read_reg(PMIC_ADDR, 0x82, dcdc1_after) &&
                read_reg(PMIC_ADDR, 0x94, aldo3_after) &&
                read_reg(PMIC_ADDR, 0x95, aldo4_after) &&
                read_reg(PMIC_ADDR, 0x90, ldo_enable_after);
            const bool verified =
                writes_ok && verify_reads_ok && dcdc1_after == 0x12 &&
                (aldo3_after & 0x1F) == 0x1C &&
                (aldo4_after & 0x1F) == 0x1C &&
                (ldo_enable_after & 0x0C) == 0x0C;
            id(photopainter_power_ready) = verified;

            ESP_LOGI(TAG,
                     "event=boot result=%s configured=%d chip_id=0x%02X "
                     "dcdc1=0x%02X->0x%02X aldo3=0x%02X->0x%02X "
                     "aldo4=0x%02X->0x%02X ldo_enable=0x%02X->0x%02X",
                     verified ? "ok" : "failed", was_configured ? 1 : 0, chip_id,
                     dcdc1_before, dcdc1_after, aldo3_before, aldo3_after,
                     aldo4_before, aldo4_after, ldo_enable_before,
                     ldo_enable_after);

            if (!verified) {
              ESP_LOGE(TAG,
                       "event=boot result=failed stage=rail_verify writes_ok=%d "
                       "reads_ok=%d",
                       writes_ok ? 1 : 0, verify_reads_ok ? 1 : 0);
              id(photopainter_power_init_complete) = true;
              return;
            }

            uint8_t status1 = 0;
            uint8_t status2 = 0;
            uint8_t rtc_seconds = 0;
            const bool axp_ok = read_reg(PMIC_ADDR, 0x00, status1) &&
                                read_reg(PMIC_ADDR, 0x01, status2);
            const bool rtc_ok = read_reg(RTC_ADDR, 0x04, rtc_seconds);
            if (axp_ok) {
              id(photopainter_axp_status1) = status1;
              id(photopainter_axp_status2) = status2;
              id(photopainter_axp_ldo_enable) = ldo_enable_after;
            }
            if (rtc_ok) id(photopainter_rtc_seconds) = rtc_seconds;
            id(photopainter_axp_state_valid) = axp_ok;
            id(photopainter_rtc_state_valid) = rtc_ok;

            ESP_LOGI(TAG,
                     "event=cache_seed axp_valid=%d rtc_valid=%d status1=0x%02X "
                     "status2=0x%02X ldo_enable=0x%02X rtc_seconds=0x%02X",
                     axp_ok ? 1 : 0, rtc_ok ? 1 : 0, status1, status2,
                     ldo_enable_after, rtc_seconds);
            id(photopainter_power_init_complete) = true;
    - priority: 780.0
      then:
        - lambda: |-
            sdmmc_host_t host = SDSPI_HOST_DEFAULT();
            host.slot = SPI3_HOST;

            sdspi_device_config_t slot_config = SDSPI_DEVICE_CONFIG_DEFAULT();
            slot_config.gpio_cs = GPIO_NUM_38;
            slot_config.host_id = SPI3_HOST;

            esp_vfs_fat_sdmmc_mount_config_t mount_config = {
                .format_if_mount_failed = false,
                .max_files = 5,
                .allocation_unit_size = 16 * 1024,
            };

            sdmmc_card_t *card = nullptr;
            const esp_err_t result = esp_vfs_fat_sdspi_mount(
                "/sdcard", &host, &slot_config, &mount_config, &card);
            const bool old_mounted = id(photopainter_sd_mounted);
            id(photopainter_sd_mounted) = result == ESP_OK;
            ESP_LOGI("photopainter_storage",
                     "event=mount old=%s new=%s result=%s path=/sdcard error=%s",
                     old_mounted ? "mounted" : "unmounted",
                     id(photopainter_sd_mounted) ? "mounted" : "unmounted",
                     result == ESP_OK ? "ok" : "failed", esp_err_to_name(result));
    - priority: -100.0
      then:
        - script.execute: photopainter_diagnostic_snapshot
    - priority: -200.0
      then:
        - wait_until:
            timeout: 10s
            condition:
              lambda: return id(photopainter_power_init_complete);
        - script.execute: photopainter_diagnostic_register_snapshot
    - priority: -100.0
      then:
        - component.update: photopainter_environment
        - component.update: photopainter_usb_voltage
        - component.update: photopainter_battery_voltage
        - component.update: photopainter_battery_level
        - lambda: |-
            id(photopainter_dashboard_gate_started_ms) = millis();
            id(photopainter_dashboard_gate_exempt).clear();
        - wait_until:
            condition:
              lambda: |-
                static std::string last_report_key;
                static uint32_t last_report_ms = 0;

                // Power initialization has not finished: nothing is readable yet.
                // Power initialization failed: release here; the branch below
                // reports the power error and requests no refresh.
                const bool init_complete = id(photopainter_power_init_complete);
                if (init_complete && !id(photopainter_power_ready)) return true;

                std::string missing;
                std::string exempt;
                auto append = [](std::string &list, const char *key) {
                  if (!list.empty()) list += ",";
                  list += key;
                };
                // ready: the entity has published (a published NAN, such as an
                // absent cell, counts; the panel draws "--" for it).
                // error_state: the reading cannot arrive because its source failed.
                auto need = [&](const char *key, bool ready, bool error_state) {
                  if (ready) return;
                  append(error_state ? exempt : missing, key);
                };

                if (!init_complete) {
                  append(missing, "power_init");
                } else {
                  const bool pmic_error = !id(photopainter_axp_state_valid);
                  const bool rtc_error = !id(photopainter_rtc_state_valid);
                  const bool environment_error = id(photopainter_environment).is_failed();
                  const bool sd_unmounted = !id(photopainter_sd_mounted);
                  // No Wi-Fi configured, Wi-Fi disabled, or the station connection
                  // abandoned (fallback AP up): neither the signal reading nor SNTP
                  // time can arrive.
                #ifdef USE_WIFI
                  auto *const wifi_component = wifi::global_wifi_component;
                  const bool wifi_connected =
                      wifi_component != nullptr && wifi_component->is_connected();
                  const bool network_error =
                      wifi_component == nullptr || wifi_component->is_disabled() ||
                      wifi_component->is_ap_active();
                #else
                  const bool wifi_connected = false;
                  const bool network_error = true;
                #endif

                  need("wifi_signal", wifi_connected, network_error);
                  need("uptime", id(photopainter_uptime).has_state(), false);
                  need("temperature", id(photopainter_temperature).has_state(), environment_error);
                  need("humidity", id(photopainter_humidity).has_state(), environment_error);
                  need("volume", id(photopainter_speaker_volume).has_state(), false);
                  need("mic_gain", id(photopainter_demo_mic_gain_control).has_state(), false);
                  need("voice_note_unread", id(photopainter_demo_voice_note_unread).has_state(), false);
                  need("usb_connected", id(photopainter_usb_connected).has_state(), pmic_error);
                  need("usb_voltage", id(photopainter_usb_voltage).has_state(), pmic_error);
                  need("battery_connected", id(photopainter_battery_connected).has_state(), pmic_error);
                  need("battery_level", id(photopainter_battery_level).has_state(), pmic_error);
                  need("battery_voltage", id(photopainter_battery_voltage).has_state(), pmic_error);
                  need("battery_charging", id(photopainter_battery_charging).has_state(), pmic_error);
                  need("sd_mounted", id(photopainter_sd_card_mounted).has_state(), false);
                  need("sd_free", id(photopainter_sd_free_space).has_state(), sd_unmounted);
                  need("sd_used", id(photopainter_sd_used_space).has_state(), sd_unmounted);
                  need("sd_total", id(photopainter_sd_total_space).has_state(), sd_unmounted);
                  need("rtc_running", id(photopainter_rtc_running).has_state(), rtc_error);
                  need("adc", id(photopainter_es7210_status).has_state(), false);
                  need("dac", id(photopainter_es8311_status).has_state(), false);
                  need("amp", id(photopainter_amplifier_status).has_state(), false);
                }

                if (missing.empty()) {
                  id(photopainter_dashboard_gate_exempt) = exempt;
                  return true;
                }

                // Report on any change to what is missing or exempted, and at
                // least every 5 s while the set is unchanged -- never per loop.
                const uint32_t now = millis();
                const std::string report_key = missing + "|" + exempt;
                if (report_key != last_report_key || now - last_report_ms >= 5000) {
                  last_report_key = report_key;
                  last_report_ms = now;
                  ESP_LOGI("photopainter_dashboard",
                           "event=first_refresh_wait missing=%s exempt=%s elapsed_ms=%u",
                           missing.c_str(), exempt.empty() ? "-" : exempt.c_str(),
                           static_cast<unsigned>(
                               now - id(photopainter_dashboard_gate_started_ms)));
                }
                return false;
        - if:
            condition:
              lambda: return id(photopainter_power_ready);
            then:
              - if:
                  condition:
                    lambda: return id(photopainter_display_active);
                  then:
                    - lambda: |-
                        id(photopainter_dashboard_released) = true;
                        const std::string &exempt = id(photopainter_dashboard_gate_exempt);
                        const unsigned wait_ms = static_cast<unsigned>(
                            millis() - id(photopainter_dashboard_gate_started_ms));
                        const char *clock =
                            id(photopainter_rtc).now().is_valid() ? "valid" : "pending";
                        if (exempt.empty()) {
                          ESP_LOGI("photopainter_dashboard",
                                   "event=first_refresh result=requested readings=ready "
                                   "exempt=- clock=%s wait_ms=%u "
                                   "update_interval=900s",
                                   clock, wait_ms);
                        } else {
                          ESP_LOGW("photopainter_dashboard",
                                   "event=first_refresh result=requested readings=exempted "
                                   "exempt=%s clock=%s wait_ms=%u "
                                   "update_interval=900s",
                                   exempt.c_str(), clock, wait_ms);
                        }
                    - component.resume:
                        id: photopainter_display
                        update_interval: 900s
                  else:
                    - component.resume:
                        id: photopainter_display
                        update_interval: 900s
                    - component.suspend: photopainter_display
                    - logger.log:
                        tag: photopainter_dashboard
                        level: WARN
                        format: event=first_refresh result=skipped reason=display_off
            else:
              - logger.log:
                  tag: photopainter_dashboard
                  level: ERROR
                  format: event=first_refresh result=exempt reason=power_error
    - priority: -250.0
      then:
        - lambda: |-
            const esp_sleep_wakeup_cause_t wake = esp_sleep_get_wakeup_cause();
            const uint64_t ext1 =
                wake == ESP_SLEEP_WAKEUP_EXT1 ? esp_sleep_get_ext1_wakeup_status() : 0;
            const char *wake_name = "other";
            switch (wake) {
              case ESP_SLEEP_WAKEUP_UNDEFINED: wake_name = "not_deep_sleep"; break;
              case ESP_SLEEP_WAKEUP_TIMER: wake_name = "timer"; break;
              case ESP_SLEEP_WAKEUP_EXT1:
                wake_name = (ext1 & (1ULL << 0)) && (ext1 & (1ULL << 4)) ? "boot_and_key"
                          : (ext1 & (1ULL << 0)) ? "boot_gpio0"
                          : (ext1 & (1ULL << 4)) ? "key_gpio4"
                          : "ext1_unattributed";
                break;
              default: break;
            }
            id(photopainter_sleep_wake_name) = wake_name;
            id(photopainter_sleep_ext1_status) = static_cast<uint32_t>(ext1);
            const bool slept =
                wake == ESP_SLEEP_WAKEUP_EXT1 || wake == ESP_SLEEP_WAKEUP_TIMER;

            // Sleep length by the external RTC, which keeps running on its own
            // backup through ESP32 deep sleep. Read hours:minutes:seconds (BCD).
            int now_s = -1;
            uint8_t reg = 0x04;
            uint8_t hms[3] = {0, 0, 0};
            if (id(photopainter_i2c).write_readv(0x51, &reg, 1, hms, 3) ==
                esphome::i2c::ERROR_OK) {
              auto bcd = [](uint8_t v) { return (v >> 4) * 10 + (v & 0x0F); };
              now_s = bcd(hms[2] & 0x3F) * 3600 + bcd(hms[1] & 0x7F) * 60 +
                      bcd(hms[0] & 0x7F);
            }
            const int entry_s = id(photopainter_sleep_entry_rtc_s);
            id(photopainter_sleep_slept_s) =
                (slept && entry_s >= 0 && now_s >= 0)
                    ? (now_s - entry_s + 86400) % 86400 : -1;
            id(photopainter_sleep_entry_rtc_s) = -1;

            id(photopainter_sleep_boot_armed) =
                !(ext1 & (1ULL << 0)) && gpio_get_level(GPIO_NUM_0) != 0;
            ESP_LOGI("photopainter_deep_sleep",
                     "event=wake cause=%s cause_raw=%d ext1=0x%02X reset_raw=%d "
                     "gpio0=%d gpio4=%d button_armed=%d entry_rtc_s=%d now_rtc_s=%d "
                     "slept_s=%d restore=boot_rails_then_codecs_then_dashboard",
                     wake_name, static_cast<int>(wake),
                     static_cast<unsigned>(ext1 & 0xFF),
                     static_cast<int>(esp_reset_reason()), gpio_get_level(GPIO_NUM_0),
                     gpio_get_level(GPIO_NUM_4),
                     id(photopainter_sleep_boot_armed) ? 1 : 0, entry_s, now_s,
                     id(photopainter_sleep_slept_s));
            if (slept) {
              // A powered codec retains its shutdown-only registers in sleep.
              id(photopainter_audio_active) = false;
            }
        - if:
            condition:
              lambda: |-
                const auto wake = esp_sleep_get_wakeup_cause();
                return wake == ESP_SLEEP_WAKEUP_EXT1 ||
                       wake == ESP_SLEEP_WAKEUP_TIMER;
            then:
              - script.execute: photopainter_audio_restore
              - script.wait: photopainter_audio_restore
              - lambda: |-
                  uint8_t reg = 0x90;
                  uint8_t enables = 0;
                  const bool rail_ok =
                      id(photopainter_i2c).write_readv(0x34, &reg, 1, &enables, 1) ==
                      esphome::i2c::ERROR_OK;
                  id(photopainter_sleep_restore_result) =
                      (id(photopainter_audio_active) &&
                       id(photopainter_display_active) && rail_ok &&
                       (enables & 0x0C) == 0x0C) ? "ok" : "degraded";
                  ESP_LOGI("photopainter_deep_sleep",
                           "event=restore result=%s audio=%d display=%d "
                           "pmic_ok=%d reg90=0x%02X aldo3=%d aldo4=%d "
                           "rtc_valid=%d",
                           id(photopainter_sleep_restore_result).c_str(),
                           id(photopainter_audio_active) ? 1 : 0,
                           id(photopainter_display_active) ? 1 : 0,
                           rail_ok ? 1 : 0, enables,
                           (enables & 0x04) ? 1 : 0, (enables & 0x08) ? 1 : 0,
                           id(photopainter_rtc_state_valid) ? 1 : 0);
  includes:
    - <esp_vfs_fat.h>
    - <sdmmc_cmd.h>
    - <driver/i2c_master.h>
    - <esp_flash.h>
    - <esp_partition.h>
    - <esp_sleep.h>
    - <driver/rtc_io.h>
  comment: PhotoPainter standalone profile - diagnostic
api:
  reboot_timeout: 0s
  encryption:
    key: !secret 'api_encryption_key'
ota:
  - platform: esphome
    encryption:
wifi:
  ssid: !secret 'wifi_ssid'
  password: !secret 'wifi_password'
  ap:
    ssid: Waveshare PhotoPainter Fallback
    password: !secret 'fallback_password'
captive_portal: null
web_server:
  version: 3
  auth:
    username: photopainter-admin
    password: !secret 'web_server_password'
  local: true
  sorting_groups:
    - id: photopainter_group_display
      name: Display
      sorting_weight: 10
    - id: photopainter_group_power
      name: Power
      sorting_weight: 20
    - id: photopainter_group_audio
      name: Audio
      sorting_weight: 30
    - id: photopainter_group_storage
      name: Storage
      sorting_weight: 40
    - id: photopainter_group_environment
      name: Environment
      sorting_weight: 50
    - id: photopainter_group_inputs
      name: Buttons & LEDs
      sorting_weight: 60
    - id: photopainter_group_diagnostics
      name: Diagnostics
      sorting_weight: 90
    - id: photopainter_group_deep_sleep
      name: Deep Sleep
      sorting_weight: 25
    - id: photopainter_group_voice_notes
      name: Voice Notes
      sorting_weight: 35
esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESPTOOLPY_FLASHMODE_QIO: y
    advanced:
      include_builtin_idf_components:
        - fatfs
        - sdmmc
        - esp_driver_sdspi
psram:
  mode: octal
  speed: 80MHz
logger:
  level: DEBUG
  logs:
    wifi: INFO
  task_log_buffer_size: 4096
  tx_buffer_size: 1024
i2c:
  - id: photopainter_i2c
    sda: GPIO47
    scl: GPIO48
    frequency: 100kHz
    scan: false
spi:
  - id: photopainter_display_spi
    interface: spi2
    clk_pin: GPIO10
    mosi_pin: GPIO11
  - id: photopainter_sd_spi
    interface: spi3
    clk_pin: GPIO39
    mosi_pin: GPIO41
    miso_pin: GPIO40
globals:
  - id: photopainter_shared_i2c_available
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: photopainter_power_ready
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: photopainter_power_init_complete
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: photopainter_i2c_fail_streak
    type: uint8_t
    restore_value: false
    initial_value: '0'
  - id: photopainter_axp_state_valid
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: photopainter_rtc_state_valid
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: photopainter_axp_status1
    type: uint8_t
    restore_value: false
    initial_value: '0'
  - id: photopainter_axp_status2
    type: uint8_t
    restore_value: false
    initial_value: '0'
  - id: photopainter_axp_ldo_enable
    type: uint8_t
    restore_value: false
    initial_value: '0'
  - id: photopainter_rtc_seconds
    type: uint8_t
    restore_value: false
    initial_value: '0'
  - id: photopainter_power_cache_seen
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: photopainter_sd_mounted
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: photopainter_pwr_pressed_ms
    type: uint32_t
    initial_value: '0'
  - id: photopainter_audio_active
    type: bool
    restore_value: false
    initial_value: 'true'
  - id: photopainter_es8311_present
    type: bool
