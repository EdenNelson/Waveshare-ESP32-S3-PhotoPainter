microphone:
  - platform: i2s_audio
    id: photopainter_microphone
    i2s_audio_id: photopainter_i2s
    i2s_din_pin: GPIO18
    adc_type: external
    pdm: false
    on_data:
      - lambda: |-
          if (id(photopainter_demo_record_file) == nullptr || x.empty()) return;
          const std::vector<uint8_t> &data = x;
          static std::vector<uint8_t> mono;
          mono.clear();
          mono.reserve(data.size() / 2);

          for (size_t i = 0; i + 3 < data.size(); i += 4) {
            const int32_t word =
                static_cast<int32_t>(static_cast<uint32_t>(data[i]) |
                (static_cast<uint32_t>(data[i + 1]) << 8) |
                (static_cast<uint32_t>(data[i + 2]) << 16) |
                (static_cast<uint32_t>(data[i + 3]) << 24));
            const int32_t raw = word >> 16;
            const uint16_t raw_magnitude =
                static_cast<uint16_t>(raw < 0 ? -raw : raw);
            if (raw_magnitude > id(photopainter_demo_record_peak_raw))
              id(photopainter_demo_record_peak_raw) = raw_magnitude;

            int32_t sample = raw * id(photopainter_demo_mic_gain);
            if (sample > 32767) sample = 32767;
            if (sample < -32768) sample = -32768;
            const int16_t pcm = static_cast<int16_t>(sample);
            const uint16_t magnitude = static_cast<uint16_t>(
                pcm < 0 ? -static_cast<int32_t>(pcm) : pcm);
            if (magnitude > id(photopainter_demo_record_peak))
              id(photopainter_demo_record_peak) = magnitude;
            mono.push_back(static_cast<uint8_t>(pcm & 0xFF));
            mono.push_back(static_cast<uint8_t>((pcm >> 8) & 0xFF));
          }

          if (!mono.empty()) {
            id(photopainter_demo_record_bytes) += fwrite(
                mono.data(), 1, mono.size(), id(photopainter_demo_record_file));
          }
