    initial_value: '-1'
script:
  - id: photopainter_i2c_recovery
    mode: single
    then:
      - lambda: |-
          const char *const TAG = "photopainter_i2c";
          const bool old_available = id(photopainter_shared_i2c_available);

          i2c_master_bus_handle_t bus_handle = nullptr;
          const esp_err_t handle_result = i2c_master_get_bus_handle(
              static_cast<i2c_port_num_t>(id(photopainter_i2c).get_port()),
              &bus_handle);
          if (handle_result != ESP_OK || bus_handle == nullptr) {
            id(photopainter_shared_i2c_available) = false;
            ESP_LOGE(TAG,
                     "event=recovery result=failed stage=get_handle error=%s",
                     esp_err_to_name(handle_result));
            return;
          }

          for (uint8_t attempt = 1; attempt <= 3; attempt++) {
            const int sda_before = gpio_get_level(GPIO_NUM_47);
            const int scl_before = gpio_get_level(GPIO_NUM_48);
            const esp_err_t reset_result = i2c_master_bus_reset(bus_handle);
            delay(25);
            const int sda_after = gpio_get_level(GPIO_NUM_47);
            const int scl_after = gpio_get_level(GPIO_NUM_48);

            uint8_t pmic_id = 0;
            uint8_t rtc_control = 0;
            uint8_t reg = 0x03;
            const bool pmic_ok =
                sda_after == 1 && scl_after == 1 &&
                id(photopainter_i2c).write_readv(0x34, &reg, 1, &pmic_id, 1) ==
                    esphome::i2c::ERROR_OK;
            reg = 0x00;
            const bool rtc_ok =
                sda_after == 1 && scl_after == 1 &&
                id(photopainter_i2c).write_readv(0x51, &reg, 1, &rtc_control, 1) ==
                    esphome::i2c::ERROR_OK;

            ESP_LOGW(TAG,
                     "event=recovery_attempt attempt=%u reset=%s "
                     "sda=%d->%d scl=%d->%d pmic=%d rtc=%d",
                     attempt, esp_err_to_name(reset_result), sda_before, sda_after,
                     scl_before, scl_after, pmic_ok ? 1 : 0, rtc_ok ? 1 : 0);

            // Either independently powered responder proves that the electrical
            // bus is available. Preserve a missing device as its own failure
            // instead of relabeling it as a whole-bus outage.
            if (pmic_ok || rtc_ok) {
              id(photopainter_shared_i2c_available) = true;
              id(photopainter_i2c_fail_streak) = 0;
              id(photopainter_axp_state_valid) = pmic_ok;
              id(photopainter_rtc_state_valid) = rtc_ok;
              ESP_LOGI(TAG,
                       "event=bus_transition old=%s new=available result=recovered "
                       "health=%s pmic=%d rtc=%d pmic_id=0x%02X "
                       "rtc_control=0x%02X",
                       old_available ? "available" : "unavailable",
                       (pmic_ok && rtc_ok) ? "full" : "degraded",
                       pmic_ok ? 1 : 0, rtc_ok ? 1 : 0, pmic_id, rtc_control);
              return;
            }
            App.feed_wdt();
            delay(100);
          }

          id(photopainter_shared_i2c_available) = false;
          ESP_LOGE(TAG, "event=recovery result=exhausted bus=unavailable");
  - id: photopainter_audio_clients_stop
    mode: single
    then:
      - media_player.stop: photopainter_media_player
      - microphone.stop_capture: photopainter_microphone
      - speaker.stop: photopainter_speaker
      - switch.turn_off: photopainter_amplifier_enable
      - script.stop: photopainter_demo_record_voice_note
      - script.stop: photopainter_demo_play_voice_note
      - rtttl.stop:
          id: photopainter_demo_rtttl
      - lambda: |-
          if (id(photopainter_demo_record_file) != nullptr) {
            id(photopainter_demo_record_file_pending) =
                id(photopainter_demo_record_file);
            id(photopainter_demo_record_file) = nullptr;
          }
      - wait_until:
          timeout: 2s
          condition:
            lambda: return id(photopainter_microphone).is_stopped();
      - lambda: |-
          if (id(photopainter_demo_play_file) != nullptr) {
            fclose(id(photopainter_demo_play_file));
            id(photopainter_demo_play_file) = nullptr;
          }
          if (id(photopainter_demo_record_file_pending) != nullptr) {
            fclose(id(photopainter_demo_record_file_pending));
            id(photopainter_demo_record_file_pending) = nullptr;
          }
          ESP_LOGI("photopainter_voice_demo",
                   "event=stop result=complete mic_stopped=%d",
                   id(photopainter_microphone).is_stopped() ? 1 : 0);
  - id: photopainter_audio_shutdown
    mode: single
    then:
      - script.execute: photopainter_audio_clients_stop
      - script.wait: photopainter_audio_clients_stop
      - delay: 500ms
      - lambda: |-
          const char *const TAG = "photopainter_audio";
          const char *const old_state =
              id(photopainter_audio_active) ? "active" : "low_power";
          if (!id(photopainter_shared_i2c_available)) {
            ESP_LOGE(TAG,
                     "event=transition old=%s new=%s result=failed "
                     "reason=i2c_unavailable amplifier=off aldo3=on",
                     old_state, old_state);
            return;
          }

          auto read_reg = [](uint8_t address, uint8_t reg, uint8_t &value) -> bool {
            return id(photopainter_i2c).write_readv(address, &reg, 1, &value, 1) ==
                   esphome::i2c::ERROR_OK;
          };
          auto write_reg = [](uint8_t address, uint8_t reg, uint8_t value) -> bool {
            uint8_t data[2] = {reg, value};
            return id(photopainter_i2c).write(address, data, sizeof(data)) ==
                   esphome::i2c::ERROR_OK;
          };
          auto update_bits = [&](uint8_t address, uint8_t reg,
                                 uint8_t clear_mask, uint8_t set_mask) -> bool {
            uint8_t before = 0;
            if (!read_reg(address, reg, before)) return false;
            const uint8_t desired =
                (before & static_cast<uint8_t>(~clear_mask)) | set_mask;
            return write_reg(address, reg, desired);
          };

          bool dac_ok = true;
          dac_ok &= update_bits(0x18, 0x31, 0x00, 0x60);
          dac_ok &= update_bits(0x18, 0x00, 0x80, 0x00);
          delay(50);
          uint8_t dac_csm = 0;
          dac_ok &= read_reg(0x18, 0xFC, dac_csm);
          dac_ok &= update_bits(0x18, 0x01, 0x3F, 0x00);

          bool adc_ok = true;
          adc_ok &= update_bits(0x40, 0x00, 0x01, 0x00);
          delay(50);
          uint8_t adc_csm = 0;
          adc_ok &= read_reg(0x40, 0x0B, adc_csm);
          adc_ok &= write_reg(0x40, 0x4B, 0xFF);
          adc_ok &= write_reg(0x40, 0x4C, 0xFF);
          adc_ok &= update_bits(0x40, 0x40, 0x00, 0x80);
          adc_ok &= update_bits(0x40, 0x01, 0x00, 0x7F);
          adc_ok &= update_bits(0x40, 0x06, 0x00, 0x07);

          if (!dac_ok || !adc_ok) {
            ESP_LOGE(TAG,
                     "event=transition old=%s new=%s result=failed "
                     "amplifier=off aldo3=on dac=%d adc=%d "
                     "dac_csm=0x%02X adc_csm=0x%02X",
                     old_state, old_state, dac_ok ? 1 : 0, adc_ok ? 1 : 0,
                     dac_csm, adc_csm);
            return;
          }

          id(photopainter_audio_active) = false;
          id(photopainter_es8311_present) = false;
          id(photopainter_es7210_present) = false;
          ESP_LOGI(TAG,
                   "event=transition old=%s new=low_power result=ok "
                   "amplifier=off aldo3=on dac_csm=0x%02X adc_csm=0x%02X",
                   old_state, dac_csm, adc_csm);
  - id: photopainter_audio_restore
    mode: single
    then:
      - lambda: |-
          const char *const TAG = "photopainter_audio";
          const char *const old_state =
              id(photopainter_audio_active) ? "active" : "low_power";
          if (!id(photopainter_shared_i2c_available)) {
            ESP_LOGE(TAG,
                     "event=transition old=%s new=%s result=failed "
                     "reason=i2c_unavailable amplifier=off aldo3=on",
                     old_state, old_state);
            return;
          }

          // These setup routines restore the components' normal register sets.
          // The shutdown-only mute and microphone-power registers are restored
          // explicitly below because the component setup routines do not write them.
          id(photopainter_audio_dac).setup();
          id(photopainter_audio_adc).setup();
          delay(100);

          auto write_reg = [](uint8_t address, uint8_t reg, uint8_t value) -> bool {
            uint8_t data[2] = {reg, value};
            return id(photopainter_i2c).write(address, data, sizeof(data)) ==
                   esphome::i2c::ERROR_OK;
          };
          auto read_reg = [](uint8_t address, uint8_t reg, uint8_t &value) -> bool {
            return id(photopainter_i2c).write_readv(address, &reg, 1, &value, 1) ==
                   esphome::i2c::ERROR_OK;
          };

          bool restore_ok = write_reg(0x18, 0x31, 0x00);
          restore_ok &= write_reg(0x40, 0x4B, 0x0F);
          restore_ok &= write_reg(0x40, 0x4C, 0x0F);
          restore_ok &= write_reg(0x40, 0x06, 0x04);

          uint8_t dac_id = 0;
          uint8_t adc_id = 0;
          uint8_t dac_mute = 0xFF;
          restore_ok &= read_reg(0x18, 0xFD, dac_id);
          restore_ok &= read_reg(0x40, 0x3D, adc_id);
          restore_ok &= read_reg(0x18, 0x31, dac_mute);
          if (!restore_ok || dac_mute != 0x00) {
            id(photopainter_audio_active) = false;
            id(photopainter_es8311_present) = false;
            id(photopainter_es7210_present) = false;
            ESP_LOGE(TAG,
                     "event=transition old=%s new=low_power result=failed "
                     "reason=codec_restore dac_id=0x%02X adc_id=0x%02X "
                     "dac_mute=0x%02X amplifier=off aldo3=on",
                     old_state, dac_id, adc_id, dac_mute);
            return;
          }

          id(photopainter_audio_active) = true;
          id(photopainter_es8311_present) = true;
          id(photopainter_es7210_present) = true;
          ESP_LOGI(TAG,
                   "event=transition old=%s new=active result=ok "
                   "dac_id=0x%02X adc_id=0x%02X dac_mute=0x%02X aldo3=on",
                   old_state, dac_id, adc_id, dac_mute);
      - if:
          condition:
            lambda: return id(photopainter_audio_active);
          then:
            - switch.turn_on: photopainter_amplifier_enable
  - id: photopainter_display_prepare_shutdown
    mode: single
    then:
      - if:
          condition:
            lambda: return !id(photopainter_display_active);
          then:
            - lambda: |-
                id(photopainter_display_shutdown_safe) = true;
                ESP_LOGI("photopainter_display",
                         "event=shutdown_wait phase=complete result=not_required "
                         "reason=aldo4_already_off safe=1");
          else:
            - component.suspend: photopainter_display
            - lambda: |-
                const bool idle = id(photopainter_display).is_idle();
                const uint32_t stamp = id(photopainter_display_refresh_started_ms);
                id(photopainter_display_shutdown_safe) = false;
                id(photopainter_display_wait_started_ms) = millis();
                ESP_LOGI("photopainter_display",
                         "event=shutdown_wait phase=start idle=%d refresh_age_ms=%ld "
                         "timeout_ms=45000 expected=%s",
                         idle ? 1 : 0,
                         stamp == 0 ? -1L : static_cast<long>(millis() - stamp),
                         idle ? "immediate" : "hold");
            - wait_until:
                timeout: 45s
                condition:
                  component.is_idle: photopainter_display
            - lambda: |-
                const uint32_t elapsed =
                    millis() - id(photopainter_display_wait_started_ms);
                const bool idle = id(photopainter_display).is_idle();
                const bool failed = id(photopainter_display).is_failed();
                id(photopainter_display_shutdown_safe) = idle || failed;
                ESP_LOGI("photopainter_display",
                         "event=shutdown_wait phase=complete result=%s elapsed_ms=%u "
                         "idle=%d failed=%d safe=%d busy=%d",
                         idle ? (elapsed < 100 ? "immediate" : "waited") : "timeout",
                         static_cast<unsigned>(elapsed), idle ? 1 : 0, failed ? 1 : 0,
                         id(photopainter_display_shutdown_safe) ? 1 : 0,
                         gpio_get_level(GPIO_NUM_13));
                id(photopainter_display_refresh_started_ms) = 0;
            - if:
                condition:
                  lambda: return id(photopainter_display_shutdown_safe);
                then:
                  - lambda: |-
                      id(photopainter_display).on_safe_shutdown();
                      ESP_LOGI("photopainter_display",
                               "event=safe_shutdown result=issued busy=%d",
                               gpio_get_level(GPIO_NUM_13));
                else:
                  - logger.log:
                      tag: photopainter_display
                      level: ERROR
                      format: event=safe_shutdown result=skipped reason=refresh_not_idle
  - id: photopainter_display_power_down
    mode: single
    then:
      - script.execute: photopainter_display_prepare_shutdown
      - script.wait: photopainter_display_prepare_shutdown
      - delay: 100ms
      - lambda: |-
          id(photopainter_display_power_down_ok) = false;
          if (!id(photopainter_display_active)) {
            id(photopainter_display_power_down_ok) = true;
            ESP_LOGI("photopainter_display",
                     "event=rail_transition old=off new=off result=noop "
                     "reason=already_off rail=aldo4");
            return;
          }
          if (!id(photopainter_display_shutdown_safe)) {
            ESP_LOGE("photopainter_display",
                     "event=rail_transition old=on new=on result=failed "
                     "reason=unsafe_panel aldo4=on");
            return;
          }
          if (!id(photopainter_shared_i2c_available)) {
            ESP_LOGE("photopainter_display",
                     "event=rail_transition old=on new=on result=failed "
                     "reason=i2c_unavailable aldo4=on");
            return;
          }

          uint8_t reg = 0x90;
          uint8_t before = 0;
          if (id(photopainter_i2c).write_readv(0x34, &reg, 1, &before, 1) !=
              esphome::i2c::ERROR_OK) {
            ESP_LOGE("photopainter_display",
                     "event=rail_transition old=unknown new=unknown result=failed "
                     "reason=reg90_read");
            return;
          }
          // Stop back-powering the panel through its inputs. While the ESP32 is
          // awake it keeps CS (GPIO9) and RESET (GPIO12) high and DC (GPIO8) at its
          // last level; with ALDO4 off those lines feed the unpowered panel through
          // its input protection (PPK2 run 1: ALDO4 off raised awake current by
          // 8-50 mA). Drive the GPIO-controlled lines low before cutting the rail.
          // The panel is already in deep sleep and is reset on the next refresh.
          // SCLK/MOSI belong to the SPI peripheral; their levels are logged.
          gpio_set_level(GPIO_NUM_9, 0);
          gpio_set_level(GPIO_NUM_8, 0);
          gpio_set_level(GPIO_NUM_12, 0);
          for (gpio_num_t pin : {GPIO_NUM_8, GPIO_NUM_9, GPIO_NUM_10, GPIO_NUM_11, GPIO_NUM_12}) {
            gpio_input_enable(pin);
          }
          ESP_LOGI("photopainter_display",
                   "event=panel_lines state=parked dc=%d cs=%d sclk=%d mosi=%d reset=%d",
                   gpio_get_level(GPIO_NUM_8), gpio_get_level(GPIO_NUM_9),
                   gpio_get_level(GPIO_NUM_10), gpio_get_level(GPIO_NUM_11),
                   gpio_get_level(GPIO_NUM_12));

          const uint8_t desired = before & static_cast<uint8_t>(~0x08);
          uint8_t data[2] = {0x90, desired};
          if (id(photopainter_i2c).write(0x34, data, sizeof(data)) !=
              esphome::i2c::ERROR_OK) {
            ESP_LOGE("photopainter_display",
                     "event=rail_transition old=on new=on result=failed "
                     "reason=reg90_write reg90=0x%02X->0x%02X",
                     before, desired);
            return;
          }

          uint8_t after = 0;
          const bool verified =
              id(photopainter_i2c).write_readv(0x34, &reg, 1, &after, 1) ==
                  esphome::i2c::ERROR_OK &&
              (after & 0x08) == 0;
          if (!verified) {
            ESP_LOGE("photopainter_display",
                     "event=rail_transition old=on new=unknown result=failed "
                     "reason=verify reg90=0x%02X->0x%02X",
                     before, after);
            return;
          }

          id(photopainter_axp_ldo_enable) = after;
          id(photopainter_display_active) = false;
          id(photopainter_display_power_down_ok) = true;
          ESP_LOGI("photopainter_display",
                   "event=rail_transition old=on new=off result=ok "
                   "rail=aldo4 reg90=0x%02X->0x%02X aldo3=on",
                   before, after);
      - if:
          condition:
            lambda: return !id(photopainter_display_power_down_ok);
          then:
            - component.resume: photopainter_display
  - id: photopainter_display_power_up
    mode: single
    then:
      - lambda: |-
          id(photopainter_display_power_up_ok) = false;
          if (id(photopainter_display_active)) {
            id(photopainter_display_power_up_ok) = true;
            ESP_LOGI("photopainter_display",
                     "event=rail_transition old=on new=on result=noop "
                     "reason=already_on rail=aldo4");
            return;
          }
          if (!id(photopainter_shared_i2c_available)) {
            ESP_LOGE("photopainter_display",
                     "event=rail_transition old=off new=off result=failed "
                     "reason=i2c_unavailable rail=aldo4");
            return;
          }

          uint8_t reg90 = 0x90;
          uint8_t reg95 = 0x95;
          uint8_t enables = 0;
          uint8_t voltage = 0;
          if (id(photopainter_i2c).write_readv(0x34, &reg90, 1, &enables, 1) !=
                  esphome::i2c::ERROR_OK ||
              id(photopainter_i2c).write_readv(0x34, &reg95, 1, &voltage, 1) !=
                  esphome::i2c::ERROR_OK) {
            ESP_LOGE("photopainter_display",
                     "event=rail_transition old=off new=off result=failed "
                     "reason=baseline_read rail=aldo4");
            return;
          }

          const uint8_t desired_voltage =
              static_cast<uint8_t>((voltage & 0xE0) | 0x1C);
          const uint8_t desired_enables =
              static_cast<uint8_t>(enables | 0x08);
          uint8_t voltage_data[2] = {0x95, desired_voltage};
          uint8_t enable_data[2] = {0x90, desired_enables};
          const bool writes_ok =
              id(photopainter_i2c).write(0x34, voltage_data,
                                         sizeof(voltage_data)) ==
                  esphome::i2c::ERROR_OK &&
              id(photopainter_i2c).write(0x34, enable_data,
                                         sizeof(enable_data)) ==
                  esphome::i2c::ERROR_OK;
          delay(100);

          uint8_t after90 = 0;
          uint8_t after95 = 0;
          const bool verified =
              writes_ok &&
              id(photopainter_i2c).write_readv(0x34, &reg90, 1, &after90, 1) ==
                  esphome::i2c::ERROR_OK &&
              id(photopainter_i2c).write_readv(0x34, &reg95, 1, &after95, 1) ==
                  esphome::i2c::ERROR_OK &&
              (after90 & 0x08) != 0 && (after95 & 0x1F) == 0x1C;
          if (!verified) {
            ESP_LOGE("photopainter_display",
                     "event=rail_transition old=off new=unknown result=failed "
                     "reason=verify reg90=0x%02X->0x%02X "
                     "reg95=0x%02X->0x%02X",
                     enables, after90, voltage, after95);
            return;
          }

          id(photopainter_axp_ldo_enable) = after90;
          id(photopainter_display_active) = true;
          id(photopainter_display_power_up_ok) = true;
          // Rail is back: return CS and RESET to their idle-high levels (DC is set
          // per transfer). The next refresh resets and re-initializes the panel.
          gpio_set_level(GPIO_NUM_9, 1);
          gpio_set_level(GPIO_NUM_12, 1);
          ESP_LOGI("photopainter_display",
                   "event=panel_lines state=restored dc=%d cs=%d sclk=%d mosi=%d reset=%d",
                   gpio_get_level(GPIO_NUM_8), gpio_get_level(GPIO_NUM_9),
                   gpio_get_level(GPIO_NUM_10), gpio_get_level(GPIO_NUM_11),
                   gpio_get_level(GPIO_NUM_12));
          ESP_LOGI("photopainter_display",
                   "event=rail_transition old=off new=on result=ok "
                   "rail=aldo4 reg90=0x%02X->0x%02X "
                   "reg95=0x%02X->0x%02X aldo3=on",
                   enables, after90, voltage, after95);
      - if:
          condition:
            lambda: return id(photopainter_display_power_up_ok);
          then:
            - component.resume: photopainter_display
  - id: photopainter_diagnostic_snapshot
    mode: queued
    then:
      - lambda: |-
          std::string nostate;
          auto missing = [&](const char *key) {
            if (!nostate.empty()) nostate += ",";
            nostate += key;
          };
          auto value = [&](const char *key, sensor::Sensor *entity) -> float {
            if (!entity->has_state()) {
              missing(key);
              return NAN;
            }
            return entity->state;
          };
          auto level = [&](const char *key, binary_sensor::BinarySensor *entity) -> int {
            if (!entity->has_state()) {
              missing(key);
              return -1;
            }
            return entity->state ? 1 : 0;
          };

          // Evaluate into locals in a fixed order; argument evaluation order in
          // the log call is unspecified and would scramble nostate=.
          // Live uptime, not the uptime sensor's last publish, which can trail by
          // up to its update interval.
          const float uptime = static_cast<float>(millis() / 1000U);
          const int usb = level("usb", id(photopainter_usb_connected));
          const float usb_v = value("usb_v", id(photopainter_usb_voltage));
          const int bat = level("bat", id(photopainter_battery_connected));
          const float bat_v = value("bat_v", id(photopainter_battery_voltage));
          const float bat_pct = value("bat_pct", id(photopainter_battery_level));
          const int charging = level("charging", id(photopainter_battery_charging));
          const float temp = value("temp_c", id(photopainter_temperature));
          const float rh = value("rh_pct", id(photopainter_humidity));
          const int rtc = level("rtc_running", id(photopainter_rtc_running));
          const int sd = level("sd", id(photopainter_sd_card_mounted));
          const float sd_total = value("sd_total_mb", id(photopainter_sd_total_space));
          const float sd_free = value("sd_free_mb", id(photopainter_sd_free_space));
          const float sd_used = value("sd_used_mb", id(photopainter_sd_used_space));
          const int key = level("key", id(photopainter_key_button));
          const int boot = level("boot", id(photopainter_boot_button));
          const int display = level("display", id(photopainter_display_status));
          const int aldo4 = level("aldo4", id(photopainter_aldo4_rail_status));
          const int amp = level("amp", id(photopainter_amplifier_status));
          const int dac = level("dac", id(photopainter_es8311_status));
          const int adc = level("adc", id(photopainter_es7210_status));
          const float heap = value("heap", id(photopainter_free_heap));
          const float psram = value("psram", id(photopainter_free_psram));

          id(photopainter_snapshot_seq) += 1;
          ESP_LOGI("photopainter_snapshot",
                   "event=snapshot seq=%u uptime_s=%.0f usb=%d usb_v=%.2f bat=%d "
                   "bat_v=%.2f bat_pct=%.0f charging=%d temp_c=%.1f rh_pct=%.1f "
                   "rtc_running=%d sd=%d sd_total_mb=%.0f sd_free_mb=%.0f "
                   "sd_used_mb=%.0f key=%d boot=%d display=%d aldo4=%d amp=%d "
                   "dac=%d adc=%d heap=%.0f psram=%.0f bus=%s nostate=%s",
                   (unsigned) id(photopainter_snapshot_seq), uptime, usb, usb_v,
                   bat, bat_v, bat_pct, charging, temp, rh, rtc, sd, sd_total,
                   sd_free, sd_used, key, boot, display, aldo4, amp, dac, adc,
                   heap, psram,
                   id(photopainter_shared_i2c_available) ? "available" : "unavailable",
                   nostate.empty() ? "-" : nostate.c_str());
  - id: photopainter_diagnostic_register_snapshot
    mode: single
    then:
      - lambda: |-
          const char *const TAG = "photopainter_registers";
          struct RegisterRef {
            uint8_t address;
            uint8_t reg;
            const char *device;
            const char *name;
          };

          // These are the registers read, verified, or modified by the board
          // package. Keeping the snapshot coupled to that set makes a log useful
          // when a state transition or recovery attempt fails.
          static const RegisterRef core_registers[] = {
            {0x34, 0x00, "AXP2101", "status1"},
            {0x34, 0x01, "AXP2101", "status2"},
            {0x34, 0x03, "AXP2101", "chip_id"},
            {0x34, 0x10, "AXP2101", "common_config"},
            {0x34, 0x20, "AXP2101", "power_on_reason"},
            {0x34, 0x21, "AXP2101", "power_off_reason"},
            {0x34, 0x12, "AXP2101", "batfet_control"},
            {0x34, 0x22, "AXP2101", "pwroff_enable"},
            {0x34, 0x25, "AXP2101", "pwroff_sequence"},
            {0x34, 0x27, "AXP2101", "pwrkey_levels"},
            {0x34, 0x82, "AXP2101", "dcdc1_voltage"},
            {0x34, 0x90, "AXP2101", "ldo_enable"},
            {0x34, 0x94, "AXP2101", "aldo3_voltage"},
            {0x34, 0x95, "AXP2101", "aldo4_voltage"},
            {0x51, 0x00, "PCF85063", "control1"},
            {0x51, 0x01, "PCF85063", "control2"},
            {0x51, 0x04, "PCF85063", "seconds"},
            {0x51, 0x05, "PCF85063", "minutes"},
            {0x51, 0x06, "PCF85063", "hours"},
            {0x51, 0x07, "PCF85063", "days"},
            {0x51, 0x08, "PCF85063", "weekdays"},
            {0x51, 0x09, "PCF85063", "months"},
            {0x51, 0x0A, "PCF85063", "years"},
          };
          static const RegisterRef audio_registers[] = {
            {0x18, 0x00, "ES8311", "reset"},
            {0x18, 0x01, "ES8311", "clock_manager1"},
            {0x18, 0x31, "ES8311", "dac_control"},
            {0x18, 0xFC, "ES8311", "csm_state"},
            {0x40, 0x00, "ES7210", "reset"},
            {0x40, 0x01, "ES7210", "clock_off"},
            {0x40, 0x06, "ES7210", "power_down"},
            {0x40, 0x0B, "ES7210", "csm_state"},
            {0x40, 0x40, "ES7210", "analog_system"},
            {0x40, 0x4B, "ES7210", "mic12_power"},
            {0x40, 0x4C, "ES7210", "mic34_power"},
          };

          auto read_one = [&](const RegisterRef &item) -> bool {
            uint8_t value = 0;
            const auto result = id(photopainter_i2c).write_readv(
                item.address, &item.reg, 1, &value, 1);
            if (result == esphome::i2c::ERROR_OK) {
              ESP_LOGD(TAG,
                       "event=register device=%s address=0x%02X reg=0x%02X "
                       "name=%s result=ok value=0x%02X",
                       item.device, item.address, item.reg, item.name, value);
              return true;
            }
            ESP_LOGE(TAG,
                     "event=register device=%s address=0x%02X reg=0x%02X "
                     "name=%s result=failed error=%u",
                     item.device, item.address, item.reg, item.name,
                     static_cast<unsigned>(result));
            return false;
          };

          const int sda = gpio_get_level(GPIO_NUM_47);
          const int scl = gpio_get_level(GPIO_NUM_48);
          ESP_LOGI(TAG,
                   "event=snapshot phase=start bus=%s sda=%d scl=%d "
                   "audio_active=%d",
                   id(photopainter_shared_i2c_available) ? "available" : "unavailable",
                   sda, scl, id(photopainter_audio_active) ? 1 : 0);

          uint16_t passed = 0;
          uint16_t failed = 0;
          for (const auto &item : core_registers) {
            read_one(item) ? passed++ : failed++;
          }
          if (id(photopainter_audio_active)) {
            for (const auto &item : audio_registers) {
              read_one(item) ? passed++ : failed++;
            }
          } else {
            ESP_LOGI(TAG,
                     "event=device_snapshot device=audio_codecs result=skipped "
                     "reason=logical_low_power");
          }

          ESP_LOGI(TAG,
                   "event=snapshot phase=complete result=%s passed=%u failed=%u "
                   "sda=%d scl=%d",
                   failed == 0 ? "ok" : "degraded",
                   static_cast<unsigned>(passed),
                   static_cast<unsigned>(failed),
                   gpio_get_level(GPIO_NUM_47), gpio_get_level(GPIO_NUM_48));
  - id: photopainter_demo_record_voice_note
    mode: single
    then:
      - lambda: |-
          if (!id(photopainter_sd_mounted)) {
            ESP_LOGE("photopainter_voice_demo",
                     "event=record result=failed reason=sd_unmounted");
            return;
          }
          id(photopainter_demo_record_file) = fopen("/sdcard/voice.wav", "wb");
          if (id(photopainter_demo_record_file) == nullptr) {
            ESP_LOGE("photopainter_voice_demo",
                     "event=record result=failed reason=file_open errno=%d",
                     errno);
            return;
          }
          uint8_t placeholder[44] = {0};
          fwrite(placeholder, 1, sizeof(placeholder),
                 id(photopainter_demo_record_file));
          id(photopainter_demo_record_bytes) = 0;
          id(photopainter_demo_record_peak) = 0;
          id(photopainter_demo_record_peak_raw) = 0;
          id(photopainter_microphone).start();
          ESP_LOGI("photopainter_voice_demo",
                   "event=record phase=start requested_ms=5000 path=/sdcard/voice.wav");
      - wait_until:
          timeout: 2s
          condition:
            lambda: return id(photopainter_microphone).is_running();
      - if:
          condition:
            lambda: return !id(photopainter_microphone).is_running();
          then:
            - lambda: |-
                if (id(photopainter_demo_record_file) != nullptr) {
                  fclose(id(photopainter_demo_record_file));
                  id(photopainter_demo_record_file) = nullptr;
                }
                id(photopainter_demo_record_bytes) = 0;
                ESP_LOGE("photopainter_voice_demo",
                         "event=record result=failed reason=mic_start_timeout "
                         "timeout_ms=2000");
          else:
            - delay: 5s
            - lambda: |-
                id(photopainter_microphone).stop();
                id(photopainter_demo_record_file_pending) =
                    id(photopainter_demo_record_file);
                id(photopainter_demo_record_file) = nullptr;
            - wait_until:
                timeout: 2s
                condition:
                  lambda: return id(photopainter_microphone).is_stopped();
            - lambda: |-
                FILE *file = id(photopainter_demo_record_file_pending);
                id(photopainter_demo_record_file_pending) = nullptr;
                if (file == nullptr) {
                  ESP_LOGE("photopainter_voice_demo",
                           "event=record result=failed reason=no_finalize_handle");
                  return;
                }

                const uint32_t bytes = id(photopainter_demo_record_bytes);
                const uint32_t sample_rate = 16000;
                const uint16_t channels = 1;
                const uint16_t bits = 16;
                const uint32_t byte_rate = sample_rate * channels * bits / 8;
                const uint16_t block_align = channels * bits / 8;
                const uint32_t chunk_size = 36 + bytes;
                uint8_t header[44] = {
                  'R','I','F','F',
                  static_cast<uint8_t>(chunk_size),
                  static_cast<uint8_t>(chunk_size >> 8),
                  static_cast<uint8_t>(chunk_size >> 16),
                  static_cast<uint8_t>(chunk_size >> 24),
                  'W','A','V','E','f','m','t',' ',16,0,0,0,1,0,
                  static_cast<uint8_t>(channels),0,
                  static_cast<uint8_t>(sample_rate),
                  static_cast<uint8_t>(sample_rate >> 8),
                  static_cast<uint8_t>(sample_rate >> 16),
                  static_cast<uint8_t>(sample_rate >> 24),
                  static_cast<uint8_t>(byte_rate),
                  static_cast<uint8_t>(byte_rate >> 8),
                  static_cast<uint8_t>(byte_rate >> 16),
                  static_cast<uint8_t>(byte_rate >> 24),
                  static_cast<uint8_t>(block_align),0,
                  static_cast<uint8_t>(bits),0,'d','a','t','a',
                  static_cast<uint8_t>(bytes),
                  static_cast<uint8_t>(bytes >> 8),
                  static_cast<uint8_t>(bytes >> 16),
                  static_cast<uint8_t>(bytes >> 24)
                };
                fseek(file, 0, SEEK_SET);
                fwrite(header, 1, sizeof(header), file);
                fclose(file);

                const uint16_t peak = id(photopainter_demo_record_peak);
                const uint16_t raw_peak = id(photopainter_demo_record_peak_raw);
                id(photopainter_demo_unread_voice_note) = bytes != 0;
                ESP_LOGI("photopainter_voice_demo",
                         "event=record result=%s bytes=%u peak=%u raw_peak=%u "
                         "gain=%d mic_stopped=%d unread=%d",
                         bytes == 0 ? "silent" : "ok",
                         static_cast<unsigned>(bytes),
                         static_cast<unsigned>(peak),
                         static_cast<unsigned>(raw_peak),
                         static_cast<int>(id(photopainter_demo_mic_gain)),
                         id(photopainter_microphone).is_stopped() ? 1 : 0,
                         id(photopainter_demo_unread_voice_note) ? 1 : 0);
  - id: photopainter_demo_play_voice_note
    mode: single
    then:
      - lambda: |-
          if (!id(photopainter_sd_mounted)) {
            ESP_LOGE("photopainter_voice_demo",
                     "event=playback result=failed reason=sd_unmounted");
            return;
          }
          id(photopainter_speaker).start();
      - wait_until:
          timeout: 3s
          condition:
            lambda: return id(photopainter_speaker).is_running();
      - if:
          condition:
            lambda: return !id(photopainter_speaker).is_running();
          then:
            - logger.log:
                tag: photopainter_voice_demo
                level: ERROR
                format: event=playback result=failed reason=speaker_start_timeout timeout_ms=3000
          else:
            - switch.turn_on: photopainter_amplifier_enable
            - delay: 50ms
            - lambda: |-
                id(photopainter_demo_play_bytes) = 0;
                id(photopainter_demo_play_peak) = 0;
                id(photopainter_demo_play_retries) = 0;
                id(photopainter_demo_zero_writes) = 0;
                id(photopainter_demo_play_file) =
                    fopen("/sdcard/voice.wav", "rb");
                if (id(photopainter_demo_play_file) == nullptr) {
                  ESP_LOGE("photopainter_voice_demo",
                           "event=playback result=failed reason=file_open errno=%d",
                           errno);
                } else {
                  fseek(id(photopainter_demo_play_file), 44, SEEK_SET);
                  ESP_LOGI("photopainter_voice_demo",
                           "event=playback phase=streaming path=/sdcard/voice.wav");
                }
            - while:
                condition:
                  lambda: return id(photopainter_demo_play_file) != nullptr;
                then:
                  - lambda: |-
                      uint8_t buffer[1024];
                      FILE *file = id(photopainter_demo_play_file);
                      const long position = ftell(file);
                      const size_t count = fread(buffer, 1, sizeof(buffer), file);
                      if (count == 0) {
                        fclose(file);
                        id(photopainter_demo_play_file) = nullptr;
                        return;
                      }
                      for (size_t i = 0; i + 1 < count; i += 2) {
                        const int16_t sample = static_cast<int16_t>(
                            static_cast<uint16_t>(buffer[i]) |
                            (static_cast<uint16_t>(buffer[i + 1]) << 8));
                        const uint16_t magnitude = static_cast<uint16_t>(
                            sample < 0 ? -static_cast<int32_t>(sample) : sample);
                        if (magnitude > id(photopainter_demo_play_peak))
                          id(photopainter_demo_play_peak) = magnitude;
                      }
                      const size_t written =
                          id(photopainter_speaker).play(buffer, count);
                      id(photopainter_demo_play_bytes) += written;
                      if (written < count) {
                        id(photopainter_demo_play_retries)++;
                        fseek(file, position + static_cast<long>(written), SEEK_SET);
                      }
                      if (written == 0) {
                        id(photopainter_demo_zero_writes)++;
                        if (id(photopainter_demo_zero_writes) >= 300) {
                          fclose(file);
                          id(photopainter_demo_play_file) = nullptr;
                          ESP_LOGE("photopainter_voice_demo",
                                   "event=playback result=failed reason=stalled "
                                   "zero_writes=%u bytes=%u",
                                   id(photopainter_demo_zero_writes),
                                   static_cast<unsigned>(id(photopainter_demo_play_bytes)));
                        }
                      } else {
                        id(photopainter_demo_zero_writes) = 0;
                      }
                  - delay: 10ms
            - speaker.finish:
                id: photopainter_speaker
            - wait_until:
                timeout: 10s
                condition:
                  speaker.is_stopped:
                    id: photopainter_speaker
            - if:
                condition:
                  lambda: return !id(photopainter_speaker).is_stopped();
                then:
                  - speaker.stop:
                      id: photopainter_speaker
            - lambda: |-
                const bool complete =
                    id(photopainter_demo_play_bytes) != 0 &&
                    id(photopainter_demo_zero_writes) < 300;
                if (complete) id(photopainter_demo_unread_voice_note) = false;
                ESP_LOGI("photopainter_voice_demo",
                         "event=playback result=%s bytes=%u peak=%u retries=%u "
                         "unread=%d",
                         complete ? "ok" : "failed",
                         static_cast<unsigned>(id(photopainter_demo_play_bytes)),
                         static_cast<unsigned>(id(photopainter_demo_play_peak)),
                         static_cast<unsigned>(id(photopainter_demo_play_retries)),
                         id(photopainter_demo_unread_voice_note) ? 1 : 0);
  - id: photopainter_sleep_request
    mode: single
    then:
      - lambda: |-
          id(photopainter_sleep_was_audio_active) = id(photopainter_audio_active);
          id(photopainter_sleep_was_display_active) = id(photopainter_display_active);
          id(photopainter_sleep_transition_ok) = id(photopainter_shared_i2c_available);
          ESP_LOGI("photopainter_deep_sleep",
                   "event=request result=%s audio=%d display=%d bus=%d "
                   "gpio0=%d rtc_valid=%d timer_minutes=%.0f",
                   id(photopainter_sleep_transition_ok) ? "accepted" : "aborted",
                   id(photopainter_sleep_was_audio_active) ? 1 : 0,
                   id(photopainter_sleep_was_display_active) ? 1 : 0,
                   id(photopainter_shared_i2c_available) ? 1 : 0,
                   gpio_get_level(GPIO_NUM_0),
                   id(photopainter_rtc_state_valid) ? 1 : 0,
                   id(photopainter_sleep_fallback_minutes).state);
          if (!id(photopainter_sleep_transition_ok)) {
            ESP_LOGE("photopainter_deep_sleep",
                     "event=abort stage=preflight reason=i2c_unavailable");
          }
      - if:
          condition:
            lambda: |-
              return id(photopainter_sleep_transition_ok) &&
                     id(photopainter_sleep_was_audio_active);
          then:
            - script.execute: photopainter_audio_shutdown
            - script.wait: photopainter_audio_shutdown
      - if:
          condition:
            lambda: |-
              return id(photopainter_sleep_transition_ok) &&
                     !id(photopainter_sleep_was_audio_active);
          then:
            - switch.turn_off: photopainter_amplifier_enable
      - lambda: |-
          if (!id(photopainter_sleep_transition_ok)) return;
          id(photopainter_sleep_transition_ok) =
              !id(photopainter_audio_active) &&
              !id(photopainter_amplifier_enable).state;
          ESP_LOGI("photopainter_deep_sleep",
                   "event=stage stage=audio result=%s audio=%d amplifier=%d aldo3=on",
                   id(photopainter_sleep_transition_ok) ? "ok" : "failed",
                   id(photopainter_audio_active) ? 1 : 0,
                   id(photopainter_amplifier_enable).state ? 1 : 0);
      - if:
          condition:
            lambda: |-
              return id(photopainter_sleep_transition_ok) &&
                     id(photopainter_sleep_was_display_active);
          then:
            - script.execute: photopainter_display_power_down
            - script.wait: photopainter_display_power_down
      - lambda: |-
          if (!id(photopainter_sleep_transition_ok)) return;
          id(photopainter_sleep_transition_ok) =
              !id(photopainter_display_active) &&
              (!id(photopainter_sleep_was_display_active) ||
               id(photopainter_display_power_down_ok));
          ESP_LOGI("photopainter_deep_sleep",
                   "event=stage stage=display result=%s display=%d safe=%d "
                   "rail_write=%d",
                   id(photopainter_sleep_transition_ok) ? "ok" : "failed",
                   id(photopainter_display_active) ? 1 : 0,
                   id(photopainter_display_shutdown_safe) ? 1 : 0,
                   id(photopainter_display_power_down_ok) ? 1 : 0);
      - if:
          condition:
            lambda: return id(photopainter_sleep_transition_ok);
          then:
            - wait_until:
                timeout: 10s
                condition:
                  lambda: |-
                    return gpio_get_level(GPIO_NUM_0) != 0 &&
                           gpio_get_level(GPIO_NUM_4) != 0;
      - lambda: |-
          if (!id(photopainter_sleep_transition_ok)) return;
          uint8_t reg90_addr = 0x90;
          uint8_t seconds_addr = 0x04;
          uint8_t reg90 = 0;
          uint8_t hms[3] = {0, 0, 0};
          const bool pmic_ok =
              id(photopainter_i2c).write_readv(0x34, &reg90_addr, 1, &reg90, 1) ==
              esphome::i2c::ERROR_OK;
          const bool rtc_ok =
              id(photopainter_i2c).write_readv(0x51, &seconds_addr, 1, hms, 3) ==
              esphome::i2c::ERROR_OK;
          const uint8_t rtc_seconds = hms[0];
          auto bcd = [](uint8_t v) { return (v >> 4) * 10 + (v & 0x0F); };
          // Bit 7 of the seconds register is the oscillator-stop flag; a stopped
          // clock cannot time the sleep, so no entry stamp is recorded.
          id(photopainter_sleep_entry_rtc_s) =
              (rtc_ok && (rtc_seconds & 0x80) == 0)
                  ? bcd(hms[2] & 0x3F) * 3600 + bcd(hms[1] & 0x7F) * 60 +
                        bcd(hms[0] & 0x7F)
                  : -1;
          const bool button_released =
              gpio_get_level(GPIO_NUM_0) != 0 && gpio_get_level(GPIO_NUM_4) != 0;
          id(photopainter_sleep_transition_ok) =
              pmic_ok && rtc_ok && button_released &&
              (reg90 & 0x04) != 0 && (reg90 & 0x08) == 0 &&
              !id(photopainter_audio_active) &&
              !id(photopainter_display_active) &&
              !id(photopainter_amplifier_enable).state;
          ESP_LOGI("photopainter_deep_sleep",
                   "event=pre_sleep result=%s pmic_ok=%d reg90=0x%02X "
                   "aldo3=%d aldo4=%d rtc_ok=%d rtc_seconds=0x%02X entry_rtc_s=%d "
                   "gpio0=%d gpio4=%d audio=%d display=%d amplifier=%d",
                   id(photopainter_sleep_transition_ok) ? "ok" : "failed",
                   pmic_ok ? 1 : 0, reg90,
                   (reg90 & 0x04) ? 1 : 0, (reg90 & 0x08) ? 1 : 0,
                   rtc_ok ? 1 : 0, rtc_seconds, id(photopainter_sleep_entry_rtc_s),
                   gpio_get_level(GPIO_NUM_0), gpio_get_level(GPIO_NUM_4),
                   id(photopainter_audio_active) ? 1 : 0,
                   id(photopainter_display_active) ? 1 : 0,
                   id(photopainter_amplifier_enable).state ? 1 : 0);
      - if:
          condition:
            lambda: return id(photopainter_sleep_transition_ok);
          then:
            - lambda: |-
                // KEY has no confirmed external pull-up; hold it high through
                // sleep with the RTC pull-up, as the vendor firmware does, so a
                // floating pin cannot satisfy ANY_LOW. GPIO0 uses external R36.
                const esp_err_t pu = rtc_gpio_pullup_en(GPIO_NUM_4);
                const esp_err_t pd = rtc_gpio_pulldown_dis(GPIO_NUM_4);
                ESP_LOGW("photopainter_deep_sleep",
                         "event=enter source=manual wake=ext1_any_low pins=gpio0,gpio4 "
                         "timer=on gpio4_rtc_pullup=%s gpio4_rtc_pulldown_off=%s "
                         "rtc=running aldo3=on aldo4=off",
                         pu == ESP_OK ? "ok" : esp_err_to_name(pu),
                         pd == ESP_OK ? "ok" : esp_err_to_name(pd));
            - deep_sleep.enter:
                id: photopainter_deep_sleep
                sleep_duration: !lambda |-
                  const float minutes = id(photopainter_sleep_fallback_minutes).state;
                  return static_cast<uint32_t>(
                      (std::isfinite(minutes) && minutes >= 1.0f && minutes <= 60.0f
                           ? minutes : 2.0f) * 60000.0f);
          else:
            - logger.log:
                tag: photopainter_deep_sleep
                level: ERROR
                format: event=abort result=recovering reason=stage_or_readback_failed
            - lambda: |-
                // A rail write can take effect despite a failed acknowledgement.
                // Correct a stale active flag before using the normal power-up
                // sequence to recover the prior state.
                uint8_t reg = 0x90;
                uint8_t enables = 0;
                const bool pmic_ok = id(photopainter_shared_i2c_available) &&
                    id(photopainter_i2c).write_readv(0x34, &reg, 1, &enables, 1) ==
                        esphome::i2c::ERROR_OK;
                if (pmic_ok && (enables & 0x08) == 0) {
                  id(photopainter_display_active) = false;
                }
                ESP_LOGW("photopainter_deep_sleep",
                         "event=recovery stage=rail_reconcile pmic_ok=%d "
                         "reg90=0x%02X display=%d",
                         pmic_ok ? 1 : 0, enables,
                         id(photopainter_display_active) ? 1 : 0);
            - if:
                condition:
                  lambda: |-
                    return id(photopainter_sleep_was_display_active) &&
                           !id(photopainter_display_active);
                then:
                  - script.execute: photopainter_display_power_up
                  - script.wait: photopainter_display_power_up
            - if:
                condition:
                  lambda: |-
                    return id(photopainter_sleep_was_audio_active) &&
                           id(photopainter_shared_i2c_available);
                then:
                  - script.execute: photopainter_audio_restore
                  - script.wait: photopainter_audio_restore
            - lambda: |-
                ESP_LOGE("photopainter_deep_sleep",
                         "event=recovery result=%s audio=%d display=%d "
                         "amplifier=%d bus=%d",
                         (id(photopainter_audio_active) ==
                              id(photopainter_sleep_was_audio_active) &&
                          id(photopainter_display_active) ==
                              id(photopainter_sleep_was_display_active))
                             ? "restored" : "degraded",
                         id(photopainter_audio_active) ? 1 : 0,
                         id(photopainter_display_active) ? 1 : 0,
                         id(photopainter_amplifier_enable).state ? 1 : 0,
                         id(photopainter_shared_i2c_available) ? 1 : 0);
interval:
  - interval: 10s
    then:
      - lambda: |-
          const char *const TAG = "photopainter_i2c";
          auto read_reg = [](uint8_t address, uint8_t reg, uint8_t &value) -> bool {
            return id(photopainter_i2c).write_readv(address, &reg, 1, &value, 1) ==
                   esphome::i2c::ERROR_OK;
          };

          uint8_t status1 = 0;
          uint8_t status2 = 0;
          uint8_t ldo_enable = 0;
          uint8_t rtc_seconds = 0;
          const bool axp_ok = read_reg(0x34, 0x00, status1) &&
                              read_reg(0x34, 0x01, status2) &&
                              read_reg(0x34, 0x90, ldo_enable);
          const bool rtc_ok = read_reg(0x51, 0x04, rtc_seconds);
          const bool old_available = id(photopainter_shared_i2c_available);

          if (axp_ok) {
            const uint8_t old_status1 = id(photopainter_axp_status1);
            const uint8_t old_status2 = id(photopainter_axp_status2);
            const uint8_t old_ldo = id(photopainter_axp_ldo_enable);

            id(photopainter_axp_status1) = status1;
            id(photopainter_axp_status2) = status2;
            id(photopainter_axp_ldo_enable) = ldo_enable;
            id(photopainter_axp_state_valid) = true;
            if (id(photopainter_power_cache_seen) &&
                (old_status1 != status1 || old_status2 != status2 ||
                 old_ldo != ldo_enable)) {
              ESP_LOGI("photopainter_power",
                       "event=register_transition status1=0x%02X->0x%02X "
                       "status2=0x%02X->0x%02X ldo_enable=0x%02X->0x%02X",
                       old_status1, status1, old_status2, status2, old_ldo,
                       ldo_enable);
            }
            id(photopainter_power_cache_seen) = true;
          } else {
            id(photopainter_axp_state_valid) = false;
            ESP_LOGW(TAG,
                     "event=poll result=failed device=axp2101 rtc=%s sda=%d scl=%d",
                     rtc_ok ? "ok" : "failed", gpio_get_level(GPIO_NUM_47),
                     gpio_get_level(GPIO_NUM_48));
          }

          const bool rtc_was_valid = id(photopainter_rtc_state_valid);
          id(photopainter_rtc_state_valid) = rtc_ok;
          if (rtc_ok) {
            // PCF85063 oscillator-stop flag (seconds bit 7). Log the edge with the
            // register context needed to tell a supply event from a stalled
            // crystal: RTC Control_1/Control_2 (STOP bit, test modes) and the
            // AXP2101 IRQ status latches (read-only here; nothing is cleared).
            const bool old_stopped =
                rtc_was_valid && (id(photopainter_rtc_seconds) & 0x80) != 0;
            const bool new_stopped = (rtc_seconds & 0x80) != 0;
            if (rtc_was_valid && old_stopped != new_stopped) {
              uint8_t ctrl1 = 0, ctrl2 = 0, irq0 = 0, irq1 = 0, irq2 = 0;
              const bool ctrl_ok = read_reg(0x51, 0x00, ctrl1) && read_reg(0x51, 0x01, ctrl2);
              const bool irq_ok = read_reg(0x34, 0x48, irq0) && read_reg(0x34, 0x49, irq1) &&
                                  read_reg(0x34, 0x4A, irq2);
              ESP_LOGW("photopainter_power",
                       "event=rtc_osc_flag old=%s new=%s seconds=0x%02X ctrl_ok=%d "
                       "rtc_ctrl1=0x%02X rtc_ctrl2=0x%02X irq_ok=%d axp_irq0=0x%02X "
                       "axp_irq1=0x%02X axp_irq2=0x%02X status1=0x%02X status2=0x%02X "
                       "uptime_ms=%u",
                       old_stopped ? "stopped" : "running",
                       new_stopped ? "stopped" : "running", rtc_seconds,
                       ctrl_ok ? 1 : 0, ctrl1, ctrl2, irq_ok ? 1 : 0, irq0, irq1, irq2,
                       status1, status2, static_cast<unsigned>(millis()));
            }
            id(photopainter_rtc_seconds) = rtc_seconds;
          } else {
            ESP_LOGW(TAG,
                     "event=poll result=failed device=pcf85063 axp=%s sda=%d scl=%d",
                     axp_ok ? "ok" : "failed", gpio_get_level(GPIO_NUM_47),
                     gpio_get_level(GPIO_NUM_48));
          }

          if (axp_ok || rtc_ok) {
            id(photopainter_shared_i2c_available) = true;
            if (id(photopainter_i2c_fail_streak) != 0) {
              ESP_LOGI(TAG,
                       "event=poll result=recovered previous_fail_streak=%u "
                       "axp=%d rtc=%d",
                       id(photopainter_i2c_fail_streak), axp_ok ? 1 : 0,
                       rtc_ok ? 1 : 0);
            }
            id(photopainter_i2c_fail_streak) = 0;
            if (!old_available) {
              ESP_LOGI(TAG,
                       "event=bus_transition old=unavailable new=available "
                       "result=poll_recovered health=%s axp=%d rtc=%d",
                       (axp_ok && rtc_ok) ? "full" : "degraded",
                       axp_ok ? 1 : 0, rtc_ok ? 1 : 0);
            }
          } else {
            if (id(photopainter_i2c_fail_streak) < 255)
              id(photopainter_i2c_fail_streak)++;
            ESP_LOGW(TAG,
                     "event=poll result=bus_failure fail_streak=%u sda=%d scl=%d",
                     id(photopainter_i2c_fail_streak),
                     gpio_get_level(GPIO_NUM_47), gpio_get_level(GPIO_NUM_48));
            if (id(photopainter_i2c_fail_streak) >= 3) {
              id(photopainter_shared_i2c_available) = false;
              if (old_available) {
                ESP_LOGE(TAG,
                         "event=bus_transition old=available new=unavailable "
                         "reason=three_polls_both_devices_failed");
              }
            }
          }

          if (id(photopainter_audio_active) && axp_ok) {
            uint8_t scratch = 0;
            id(photopainter_es8311_present) = read_reg(0x18, 0x00, scratch);
            id(photopainter_es7210_present) =
                id(photopainter_i2c).write_readv(0x40, nullptr, 0, &scratch, 1) ==
                esphome::i2c::ERROR_OK;
          }
      - if:
          condition:
            lambda: return !id(photopainter_shared_i2c_available);
          then:
            - script.execute: photopainter_i2c_recovery
  - interval: 60s
    then:
      - lambda: |-
          ESP_LOGI("photopainter_state",
                   "event=level power_ready=%d bus=%s axp_valid=%d rtc_valid=%d "
                   "status1=0x%02X status2=0x%02X ldo_enable=0x%02X "
                   "rtc_seconds=0x%02X display=%s audio=%s amplifier=%s "
                   "sd=%s sda=%d scl=%d",
                   id(photopainter_power_ready) ? 1 : 0,
                   id(photopainter_shared_i2c_available) ? "available" : "unavailable",
                   id(photopainter_axp_state_valid) ? 1 : 0,
                   id(photopainter_rtc_state_valid) ? 1 : 0,
                   id(photopainter_axp_status1), id(photopainter_axp_status2),
                   id(photopainter_axp_ldo_enable), id(photopainter_rtc_seconds),
                   id(photopainter_display_active) ? "active" : "off",
                   id(photopainter_audio_active) ? "active" : "low_power",
                   id(photopainter_amplifier_enable).state ? "on" : "off",
                   id(photopainter_sd_mounted) ? "mounted" : "unmounted",
                   gpio_get_level(GPIO_NUM_47), gpio_get_level(GPIO_NUM_48));
  - interval: 1s
    then:
      - lambda: |-
          const uint32_t pressed = id(photopainter_pwr_pressed_ms);
          if (pressed != 0) {
            ESP_LOGW("photopainter_input", "event=pwr_button state=held hold_ms=%u",
                     static_cast<unsigned>(millis() - pressed));
          }
  - interval: 60s
    then:
      - script.execute: photopainter_diagnostic_snapshot
  - interval: 10s
    then:
      - lambda: |-
          if (!id(photopainter_sleep_boot_armed) &&
              gpio_get_level(GPIO_NUM_0) != 0) {
            id(photopainter_sleep_boot_armed) = true;
            ESP_LOGI("photopainter_deep_sleep",
                     "event=boot_button state=rearmed gpio0=1 source=level");
          }
  - interval: 60s
    then:
      - lambda: |-
          ESP_LOGI("photopainter_deep_sleep",
                   "event=level wake=%s wake_raw=%d ext1=0x%02X reset_raw=%d "
                   "restore=%s slept_s=%d gpio0=%d gpio4=%d button_armed=%d "
                   "audio=%d display=%d amplifier=%d aldo3=%d aldo4=%d "
                   "rtc_valid=%d bus=%d",
                   id(photopainter_sleep_wake_name).c_str(),
                   static_cast<int>(esp_sleep_get_wakeup_cause()),
                   static_cast<unsigned>(id(photopainter_sleep_ext1_status) & 0xFF),
                   static_cast<int>(esp_reset_reason()),
                   id(photopainter_sleep_restore_result).c_str(),
                   id(photopainter_sleep_slept_s),
                   gpio_get_level(GPIO_NUM_0), gpio_get_level(GPIO_NUM_4),
                   id(photopainter_sleep_boot_armed) ? 1 : 0,
                   id(photopainter_audio_active) ? 1 : 0,
                   id(photopainter_display_active) ? 1 : 0,
                   id(photopainter_amplifier_enable).state ? 1 : 0,
                   (id(photopainter_axp_ldo_enable) & 0x04) ? 1 : 0,
                   (id(photopainter_axp_ldo_enable) & 0x08) ? 1 : 0,
                   id(photopainter_rtc_state_valid) ? 1 : 0,
                   id(photopainter_shared_i2c_available) ? 1 : 0);
time:
  - platform: pcf85063
    id: photopainter_rtc
    i2c_id: photopainter_i2c
    address: 81
    update_interval: never
  - platform: sntp
    id: photopainter_sntp_time
    on_time_sync:
      then:
        - pcf85063.write_time: null
sensor:
  - platform: shtcx
    id: photopainter_environment
    i2c_id: photopainter_i2c
    address: 112
    update_interval: 60s
    temperature:
      id: photopainter_temperature
      name: PhotoPainter Temperature
      web_server:
        sorting_group_id: photopainter_group_environment
        sorting_weight: 10
    humidity:
      id: photopainter_humidity
      name: PhotoPainter Humidity
      web_server:
        sorting_group_id: photopainter_group_environment
        sorting_weight: 20
  - platform: template
    id: photopainter_usb_voltage
    name: PhotoPainter USB-C Voltage
    unit_of_measurement: V
    device_class: voltage
    accuracy_decimals: 2
    update_interval: 60s
    lambda: |-
      if (!id(photopainter_axp_state_valid)) return {};
      if ((id(photopainter_axp_status1) & 0x20) == 0) return 0.0f;

      uint8_t adc_enable = 0;
      uint8_t adc_reg = 0x30;
      if (id(photopainter_i2c).write_readv(0x34, &adc_reg, 1, &adc_enable, 1) !=
          esphome::i2c::ERROR_OK) {
        ESP_LOGW("photopainter_telemetry",
                 "event=read result=failed metric=usb_voltage stage=adc_enable");
        return {};
      }
      if ((adc_enable & 0x04) == 0) {
        uint8_t data[2] = {0x30, static_cast<uint8_t>(adc_enable | 0x04)};
        if (id(photopainter_i2c).write(0x34, data, sizeof(data)) !=
            esphome::i2c::ERROR_OK) {
          ESP_LOGW("photopainter_telemetry",
                   "event=read result=failed metric=usb_voltage stage=adc_enable_write");
          return {};
        }
      }

      uint8_t msb = 0;
      uint8_t lsb = 0;
      uint8_t msb_reg = 0x38;
      uint8_t lsb_reg = 0x39;
      if (id(photopainter_i2c).write_readv(0x34, &msb_reg, 1, &msb, 1) !=
              esphome::i2c::ERROR_OK ||
          id(photopainter_i2c).write_readv(0x34, &lsb_reg, 1, &lsb, 1) !=
              esphome::i2c::ERROR_OK) {
        ESP_LOGW("photopainter_telemetry",
                 "event=read result=failed metric=usb_voltage stage=sample");
        return {};
      }
      return (((msb & 0x3F) << 8) | lsb) / 1000.0f;
    web_server:
      sorting_group_id: photopainter_group_power
      sorting_weight: 20
  - platform: template
    id: photopainter_battery_voltage
    name: PhotoPainter Battery Voltage
    unit_of_measurement: V
    device_class: voltage
    accuracy_decimals: 2
    update_interval: 60s
    lambda: |-
      if (!id(photopainter_axp_state_valid)) return {};
      if ((id(photopainter_axp_status1) & 0x08) == 0) return NAN;

      uint8_t msb = 0;
      uint8_t lsb = 0;
      uint8_t msb_reg = 0x34;
      uint8_t lsb_reg = 0x35;
      if (id(photopainter_i2c).write_readv(0x34, &msb_reg, 1, &msb, 1) !=
              esphome::i2c::ERROR_OK ||
          id(photopainter_i2c).write_readv(0x34, &lsb_reg, 1, &lsb, 1) !=
              esphome::i2c::ERROR_OK) {
        ESP_LOGW("photopainter_telemetry",
                 "event=read result=failed metric=battery_voltage stage=sample");
        return {};
      }
      return (((msb & 0x3F) << 8) | lsb) / 1000.0f;
    web_server:
      sorting_group_id: photopainter_group_power
      sorting_weight: 40
  - platform: template
    id: photopainter_battery_level
    name: PhotoPainter Battery Level
    unit_of_measurement: '%'
    device_class: battery
    accuracy_decimals: 0
    update_interval: 180s
    lambda: |-
      if (!id(photopainter_axp_state_valid)) return {};
      if ((id(photopainter_axp_status1) & 0x08) == 0) return NAN;

      uint8_t percentage = 0;
      uint8_t reg = 0xA4;
      if (id(photopainter_i2c).write_readv(0x34, &reg, 1, &percentage, 1) !=
          esphome::i2c::ERROR_OK) {
        ESP_LOGW("photopainter_telemetry",
                 "event=read result=failed metric=battery_level stage=sample");
        return {};
      }
      return percentage <= 100 ? optional<float>(percentage) : optional<float>();
    web_server:
      sorting_group_id: photopainter_group_power
      sorting_weight: 50
  - platform: template
    id: photopainter_sd_total_space
    name: PhotoPainter SD Card Total Space
    unit_of_measurement: MB
    accuracy_decimals: 0
    update_interval: 300s
    lambda: |-
      if (!id(photopainter_sd_mounted)) return {};
      uint64_t total = 0;
      uint64_t free = 0;
      if (esp_vfs_fat_info("/sdcard", &total, &free) != ESP_OK) {
        ESP_LOGW("photopainter_storage",
                 "event=capacity result=failed metric=total path=/sdcard");
        return {};
      }
      return total / (1024.0 * 1024.0);
    web_server:
      sorting_group_id: photopainter_group_storage
      sorting_weight: 20
  - platform: template
    id: photopainter_sd_free_space
    name: PhotoPainter SD Card Free Space
    unit_of_measurement: MB
    accuracy_decimals: 0
    update_interval: 300s
    lambda: |-
      if (!id(photopainter_sd_mounted)) return {};
      uint64_t total = 0;
      uint64_t free = 0;
      if (esp_vfs_fat_info("/sdcard", &total, &free) != ESP_OK) {
        ESP_LOGW("photopainter_storage",
                 "event=capacity result=failed metric=free path=/sdcard");
        return {};
      }
      return free / (1024.0 * 1024.0);
    web_server:
      sorting_group_id: photopainter_group_storage
      sorting_weight: 40
  - platform: template
    id: photopainter_sd_used_space
    name: PhotoPainter SD Card Used Space
    unit_of_measurement: MB
    accuracy_decimals: 0
    update_interval: 300s
    lambda: |-
      if (!id(photopainter_sd_mounted)) return {};
      uint64_t total = 0;
      uint64_t free = 0;
      if (esp_vfs_fat_info("/sdcard", &total, &free) != ESP_OK) {
        ESP_LOGW("photopainter_storage",
                 "event=capacity result=failed metric=used path=/sdcard");
        return {};
      }
      return (total - free) / (1024.0 * 1024.0);
    web_server:
      sorting_group_id: photopainter_group_storage
      sorting_weight: 30
  - platform: uptime
    id: photopainter_uptime
    name: PhotoPainter Uptime
    type: seconds
    web_server:
      sorting_group_id: photopainter_group_diagnostics
      sorting_weight: 10
  - platform: template
    id: photopainter_free_heap
    name: PhotoPainter Free Heap
    icon: mdi:counter
    unit_of_measurement: B
    accuracy_decimals: 0
    state_class: measurement
    entity_category: diagnostic
    update_interval: 30s
    lambda: return static_cast<float>(heap_caps_get_free_size(MALLOC_CAP_INTERNAL));
    web_server:
      sorting_group_id: photopainter_group_diagnostics
      sorting_weight: 20
  - platform: template
    id: photopainter_free_psram
    name: PhotoPainter Free PSRAM
    icon: mdi:counter
    unit_of_measurement: B
    accuracy_decimals: 0
    state_class: measurement
    entity_category: diagnostic
    update_interval: 30s
    lambda: return static_cast<float>(heap_caps_get_free_size(MALLOC_CAP_SPIRAM));
    web_server:
      sorting_group_id: photopainter_group_diagnostics
      sorting_weight: 30
binary_sensor:
  - platform: template
    id: photopainter_usb_connected
    name: PhotoPainter USB-C Connected
    device_class: plug
    trigger_on_initial_state: true
    lambda: |-
      if (!id(photopainter_axp_state_valid)) return {};
      return (id(photopainter_axp_status1) & 0x20) != 0;
    on_state:
      then:
        - component.update: photopainter_usb_voltage
    web_server:
      sorting_group_id: photopainter_group_power
      sorting_weight: 10
  - platform: template
    id: photopainter_battery_connected
    name: PhotoPainter Battery Connected
    device_class: power
    trigger_on_initial_state: true
    lambda: |-
      if (!id(photopainter_axp_state_valid)) return {};
      return (id(photopainter_axp_status1) & 0x08) != 0;
    on_state:
      then:
        - component.update: photopainter_battery_voltage
        - component.update: photopainter_battery_level
    web_server:
      sorting_group_id: photopainter_group_power
      sorting_weight: 30
  - platform: template
    id: photopainter_battery_charging
    name: PhotoPainter Battery Charging
    device_class: battery_charging
    trigger_on_initial_state: true
    lambda: |-
      if (!id(photopainter_axp_state_valid)) return {};
      return (id(photopainter_axp_status2) & 0x60) == 0x20;
    on_state:
      then:
        - component.update: photopainter_battery_voltage
    web_server:
      sorting_group_id: photopainter_group_power
      sorting_weight: 60
  - platform: template
    id: photopainter_rtc_running
    name: PhotoPainter RTC Running
    lambda: |-
