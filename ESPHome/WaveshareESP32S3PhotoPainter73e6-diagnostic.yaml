  - platform: gpio
    id: photopainter_boot_button
    name: PhotoPainter BOOT Button
    pin:
      number: GPIO0
      ignore_strapping_warning: true
      inverted: true
      mode:
        input: true
        pullup: true
      allow_other_uses: true
    on_press:
      - lambda: id(photopainter_sleep_boot_pressed_ms) = millis();
    on_release:
      - lambda: |-
          const uint32_t hold_ms = millis() - id(photopainter_sleep_boot_pressed_ms);
          if (id(photopainter_sleep_boot_pressed_ms) != 0 &&
              (hold_ms < 1500 || hold_ms > 5000)) {
            ESP_LOGI("photopainter_deep_sleep",
                     "event=boot_button result=ignored reason=%s hold_ms=%u window_ms=1500-5000",
                     hold_ms < 1500 ? "hold_too_short" : "hold_too_long",
                     static_cast<unsigned>(hold_ms));
          }
      - if:
          condition:
            lambda: return !id(photopainter_sleep_boot_armed);
          then:
            - delay: 2s
            - lambda: |-
                if (gpio_get_level(GPIO_NUM_0) != 0) {
                  id(photopainter_sleep_boot_armed) = true;
                  ESP_LOGI("photopainter_deep_sleep",
                           "event=boot_button state=rearmed gpio0=1");
                }
    on_click:
      - min_length: 1500ms
        max_length: 5000ms
        then:
          - if:
              condition:
                lambda: return id(photopainter_sleep_boot_armed);
              then:
                - script.execute: photopainter_sleep_request
              else:
                - logger.log:
                    tag: photopainter_deep_sleep
